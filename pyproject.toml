[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neurofm"
version = "0.1.0"
description = "Foundation model for individualized brain health estimation from T1w MRI."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.8,<3.11"
authors = [
    { name = "Your Name", email = "you@institution.edu" }
]
keywords = [
    "neuroimaging",
    "foundation model",
    "brain age",
    "MRI",
    "deep learning",
    "TensorFlow",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
]

dependencies = [
    "tensorflow==2.13.0",
    "numpy>=1.23.5,<2.0.0",
    "typing-extensions>=3.6.6,<4.6.0",
    "nibabel>=5.0.0",
    "scipy>=1.10.0",
    "pandas>=2.0.0",
    "huggingface_hub>=0.20.0,<0.24.0",
    "pydantic>=1.10,<2.0",
    "loguru>=0.7.0",
]

[project.optional-dependencies]
# Notebook support
notebooks = [
    "jupyter>=1.0.0",
    "matplotlib>=3.7.0",
    "nilearn>=0.10.0",
]
# Training and augmentation (not required for inference)
training = [
    "elasticdeform>=0.5.0",
]
# Full development environment
dev = [
    "neurofm[notebooks,training]",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "ipython>=8.0.0",
]

[project.scripts]
neurofm = "scripts.run_inference:main"

[project.urls]
Homepage = "https://github.com/rockNroll87q/NeuroFM"
Paper = ""
"Bug Tracker" = "https://github.com/rockNroll87q/NeuroFM/issues"
Zenodo = ""

[tool.setuptools.packages.find]
where = ["."]
include = ["neurofm*"]

[tool.black]
line-length = 88
target-version = ["py38", "py39"]

[tool.ruff]
line-length = 88
target-version = "py38"
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=neurofm --cov-report=term-missing"