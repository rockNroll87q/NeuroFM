name: Build and push Docker containers

on:
  push:
    branches:
      - main
    paths:
      - "docker/Dockerfile"
      - "docker/Dockerfile.cpu"
      - "docker/Dockerfile.notebook"
      - "requirements.txt"
    tags:
      - "v*.*.*"   # trigger on version tags for release builds
  pull_request:
    branches:
      - main
    paths:
      - "docker/Dockerfile"
      - "docker/Dockerfile.cpu"
      - "docker/Dockerfile.notebook"
      - "requirements.txt"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - dockerfile: docker/Dockerfile
            tag: latest
            platforms: linux/amd64
          - dockerfile: docker/Dockerfile.cpu
            tag: cpu
            platforms: linux/amd64
          - dockerfile: docker/Dockerfile.notebook
            tag: notebook
            platforms: linux/amd64

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Uncomment if disk space is an issue during builds
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve version
        id: version
        run: |
          # Prefer git tag if this is a tagged release, fall back to version.txt
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
            echo "source=git-tag" >> $GITHUB_OUTPUT
          else
            VERSION=$(cat version.txt | tr -d '[:space:]')
            echo "source=version.txt" >> $GITHUB_OUTPUT
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Resolved version: $VERSION"

      - name: Build and push ${{ matrix.tag }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: |
            rocknroll87q/neurofm:${{ matrix.tag }}
            rocknroll87q/neurofm:${{ matrix.tag }}-${{ steps.version.outputs.version }}
          # Bake version into image metadata
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.source=https://github.com/rockNroll87q/NeuroFM
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.tag }}
          cache-to: type=gha,mode=max,scope=${{ matrix.tag }}

      # Load and test runtime to make sure container is operational
      # The notebook version gets tested differently since it is running jupyter
      - name: Smoke test ${{ matrix.tag }}
        if: github.event_name == 'pull_request'
        run: |
          if [ "${{ matrix.tag }}" = "notebook" ]; then
            # Notebook container starts a Jupyter server, not a CLI —
            # just verify the key packages import cleanly instead
            docker run --rm --entrypoint python rocknroll87q/neurofm:${{ matrix.tag }} \
              -c "import jupyter; import neurofm; print('OK')"
          else
            docker run --rm rocknroll87q/neurofm:${{ matrix.tag }} --help
          fi