name: Build and push Docker containers

on:
  push:
    branches:
      - main
    paths:
      - "docker/Dockerfile"
      - "docker/Dockerfile.cpu"
      - "docker/Dockerfile.notebook"
      - "requirements.txt"
  pull_request:
    branches:
      - main
    paths:
      - "docker/Dockerfile"
      - "docker/Dockerfile.cpu"
      - "docker/Dockerfile.notebook"
      - "requirements.txt"
  # Allow manual trigger from the Actions tab
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false   # don't cancel other builds if one fails
      matrix:
        include:
          - dockerfile: docker/Dockerfile
            tag: latest
            platforms: linux/amd64
          - dockerfile: docker/Dockerfile.cpu
            tag: cpu
            platforms: linux/amd64
          - dockerfile: docker/Dockerfile.notebook
            tag: notebook
            platforms: linux/amd64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        # Only push on main branch, not on PRs
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract version tag from pyproject.toml
        id: version
        run: |
          VERSION=$(grep '^version' pyproject.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build and push ${{ matrix.tag }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}
          # Push only on main, build-only on PRs (good for catching broken Dockerfiles early)
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            rocknroll87q/neurofm:${{ matrix.tag }}
            rocknroll87q/neurofm:${{ matrix.tag }}-${{ steps.version.outputs.version }}
          # Cache layers between builds — significantly speeds up rebuilds
          # when only requirements.txt changes and the apt layer is unchanged
          cache-from: type=gha,scope=${{ matrix.tag }}
          cache-to: type=gha,mode=max,scope=${{ matrix.tag }}